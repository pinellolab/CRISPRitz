{% set version = "2.9.0" %}

package:
  name: crispritz
  version: {{ version }}

source:
  url: https://github.com/pinellolab/CRISPRitz/archive/v{{ version }}.tar.gz
  sha256: 

build:
  number: 0

requirements:
  build:
    - {{compiler('cxx')}} =5.4 # [not osx]
    - {{compiler('cxx')}} # [osx]
    - make
    - boost
    - openmp
    - zlib

  # CRISPRitz is now a PURE ENUMERATION ENGINE (index-genome / search / add-variants).
  # All scoring (CFD + azimuth), annotation and reporting moved to CRISPRme+, so the
  # heavy ML stack that forced the exact pins is GONE: no scikit-learn / scipy /
  # matplotlib / biopython / statsmodels / intervaltree, and numpy/pandas are UNPINNED
  # (the numerical stack now floats free). This is what lets downstream packages that
  # need a modern numpy/pandas (e.g. CRISPRme+) depend on crispritz without a conflict.
  # The add-variants Python-fallback enricher uses pandas; the C++ engine links against
  # boost/openmp/zlib/libdeflate; add-variants shells out to bcftools.
  host:
    - bcftools
    - boost
    - openmp
    - libdeflate
    - zlib
    - python >=3.11

  run:
    - pandas
    - bcftools
    - boost
    - openmp
    - libdeflate
    - zlib
    - python >=3.11

test:
  commands:
    # exercise the dispatch for EVERY engine subcommand (catches a broken import or a
    # bad dep bump, which the old `--help`-only test would silently pass). The real
    # index+search golden-output regression lives in the GitHub Actions CI.
    - crispritz.py
    - crispritz.py index-genome help
    - crispritz.py search help
    - crispritz.py add-variants help

about:
  home: https://github.com/pinellolab/CRISPRitz
  license: GPL3
  summary: CRISPRitz, tool package for CRISPR experiments assessment and analysis.
