{% set version = "1.1.1" %}

package:
  name: crispritz
  version: {{ version }}

source:
  url: https://github.com/InfOmics/CRISPRitz/archive/v{{ version }}.tar.gz
  sha256: 

build:
  number: 0

requirements:
  build:
    - {{compiler('cxx')}} =5.4 # [not osx]
    - {{compiler('cxx')}} # [osx]
    - make
    - boost
    - openmp
    
  host:
    - intervaltree
    - matplotlib
    - pandas ==2.0.3
    - scipy ==1.10.1
    - numpy ==1.24.4
    # The azimuth (Doench 2016) on-target model is vendored from CRISPR-HAWK and
    # only unpickles on this scikit-learn/numpy combo (see
    # sourceCode/Python_Scripts/Scores/azimuth/ATTRIBUTION.md). Do NOT bump
    # scikit-learn past 1.1.x without re-serializing the model: sklearn 1.2
    # removed sklearn.ensemble._gb_losses, which the model references.
    - scikit-learn ==1.1.3
    - biopython
    - more-itertools
    - statsmodels
    - bcftools
    - boost
    - tk
    - openmp
    - libdeflate
    - python >=3.11

  run:
    - intervaltree
    - matplotlib
    - pandas ==2.0.3
    - scipy ==1.10.1
    - numpy ==1.24.4
    # The azimuth (Doench 2016) on-target model is vendored from CRISPR-HAWK and
    # only unpickles on this scikit-learn/numpy combo (see
    # sourceCode/Python_Scripts/Scores/azimuth/ATTRIBUTION.md). Do NOT bump
    # scikit-learn past 1.1.x without re-serializing the model: sklearn 1.2
    # removed sklearn.ensemble._gb_losses, which the model references.
    - scikit-learn ==1.1.3
    - biopython
    - more-itertools
    - statsmodels
    - bcftools
    - boost
    - tk
    - openmp
    - libdeflate
    - python >=3.11

test:
  commands:
    - crispritz.py

about:
  home: https://github.com/InfOmics/CRISPRitz
  license: GPL3
  summary: CRISPRitz, tool package for CRISPR experiments assessment and analysis.
