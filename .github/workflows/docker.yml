name: Docker multi-arch build

# Tracks the health of the root Dockerfile for both linux/amd64 and
# linux/arm64 (Apple Silicon / aarch64) by building — but NOT pushing — a
# multi-arch image.
#
# NOTE: at the time this workflow was added the Dockerfile does NOT build (it
# fails at `conda install python=3.8` with a solver conflict against the
# current continuumio/miniconda3 base — a pre-existing staleness bug, not
# arm64-specific). The job below is therefore `continue-on-error: true` and is
# purely informational: it surfaces Dockerfile / base-image / bioconda drift
# early without gating the PR. The hard aarch64 guarantee lives in the
# source-level arm64-build job in ci.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  buildx:
    name: buildx amd64 + arm64 (no push)
    runs-on: ubuntu-latest
    # Informational early-warning only: it must not gate the source-level CI.
    # As of this change the root Dockerfile does NOT build on any arch: the
    # `RUN conda install python=3.8` step fails with a LibMambaUnsatisfiableError
    # because the pinned python=3.8 is unsatisfiable against the current
    # continuumio/miniconda3 base + channels. That is a pre-existing Dockerfile
    # staleness bug (not arm64-specific and not introduced here); fixing it is a
    # separate follow-up. Until then this job surfaces the state without turning
    # the PR red -- the hard aarch64 guarantee is the source-level arm64-build
    # job in ci.yml.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
