name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: build + minimal search test (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libgomp1

      - name: Run minimal test (NGG)
        run: bash test/run_minimal_test.sh
        env:
          PAM: NGG

  pam-filter:
    name: PAM filter / --prune-pam equivalence (incl padded L<K)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libgomp1
      - name: Run PAM-filter test suite
        run: bash test/run_pam_filter_test.sh

  enricher-ports:
    name: enricher.py and enricher.cpp agree (incl. multiallelic sites, split and joined)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # python3-pandas: enricher.py imports pandas, which the runner's python3 does
      # not ship, so without it the reference port cannot run at all.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ zlib1g-dev python3-pandas

      # enricher.cpp is meant to be a faithful port of enricher.py, and the
      # packaged install silently falls back to the Python one when the binary is
      # absent, so the two must not drift. verify_enricher.sh synthesizes a VCF of
      # 33 cases -- biallelic and multiallelic SNPs, a non-PASS record, insertions,
      # deletions, a site carrying TWO indel alleles (the case where a per-allele
      # window built on the previous allele's output compounds them), the SNP+indel
      # combinations, the chromosome edges, multiallelic SNPs whose ALTs include
      # '*', and multi-allelic sites split into one record per ALT (every record
      # order, all four bases coded Q, genotype shapes, SNP + indel at one position,
      # two ALTs on one haplotype slot), INFO/AF read by its key, the same REF>ALT on
      # two records, ALTs on a reference N
      # -- then diffs all four outputs byte-for-byte, plus the file set and the run log,
      # and checks them against what they must be: the enriched genome against an
      # independent reconstruction (the N-count invariant among it), the dict and the
      # indel log at the new cases, and a reference holding Q refused alike.
      - name: Build the C++ enricher
        run: g++ -std=c++11 -O2 sourceCode/Python_Scripts/Enrichment/enricher.cpp -o /tmp/enricher_opt -lz

      - name: enricher.py vs enricher.cpp, byte-for-byte
        working-directory: sourceCode/Python_Scripts/Enrichment
        run: bash verify_enricher.sh /tmp/enricher_opt

      # Agreement is not correctness: both ports kept only the last record's ALT of a
      # split multi-allelic site for years, in agreement. These tests run each port on
      # small inputs and check the exact enriched base, dict entries and indel outputs.
      - name: multi-allelic enrichment, exact outputs of both ports
        run: ENRICHER_BIN=/tmp/enricher_opt python3 test/test_enricher_multiallelic.py -v

      # add-variants runs one enricher per chromosome in a Pool and used to ignore
      # their exit status, so a crashed or killed enricher left it at exit 0 with
      # that chromosome missing. A stub enricher on PATH makes each outcome exact.
      # With the shipped enricher: a chromosome it copies (no VCF) holding Q is
      # refused, and a README, .DS_Store or .fai beside the chromosomes is ignored.
      - name: add-variants fails when an enricher fails
        run: bash test/run_add_variants_status_test.sh

  flank-n:
    name: hard genomic N in the stored PAM/flank region
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libgomp1

      # A genomic 'N' converts to 0000, which intersects nothing, so an 'N' in the
      # wide flank a PAM-less index stores used to exclude the target even though a
      # dedicated index for a SHORTER PAM over the same guide region keeps it. This
      # job plants targets on BOTH strands with the 'N' at an exact flank offset and
      # asserts: the dedicated index finds exactly the planted set (so equivalence
      # cannot pass by both sides being equally wrong), a guide-region 'N' is in
      # neither index, PAM-less + prune == dedicated over a mismatch/bulge matrix,
      # and the stored 'N' survives the writer and the loader.
      - name: Run flank-N regression test
        run: bash test/run_flank_n_test.sh

      # Relaxing the PAM scan for an all-N PAM removed the out-of-bounds read that used
      # to crash buildTST on a contig shorter than one target window, and left its
      # wrapped unsigned loop running until memory ran out. Header-only, 10-bp and
      # one-base-short contigs must exit 0 at once with no .bin, for 3' and 5' all-N
      # and a dedicated PAM, under a timeout and a 4 GB address-space cap.
      - name: buildTST on a contig too short for a target
        run: bash test/run_short_contig_test.sh

  four-allele:
    name: four-allele symbol Q end to end (add-variants, index-genome, search == oracle and brute force)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # python3-pandas: add-variants runs enricher.py too (the test compares both ports)
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libgomp1 zlib1g-dev python3-pandas

      # A position whose reference base and SNP ALTs cover A, C, G and T is written Q,
      # which buildTST, searchTST and searchBruteForce read as any base (N stays a gap).
      # Synthetic contigs put Q in guides, in PAMs that exist only through it, in the
      # pad, beside N runs and on contig ends; through crispritz.py add-variants (both
      # ports), index-genome (3' and 5', dedicated and PAM-less) and search, every
      # search must equal test/boundary/oracle.py, every 0-bulge one searchBruteForce,
      # no row may hold an N, a .bin is flagged four_allele exactly when it holds Q, and
      # the brute force at -mm 120 reports no window with an N in its guide (a guide
      # with one N is planted beside a PAM: an N used to cost 101 mismatches).
      - name: Run four-allele test
        run: bash test/run_four_allele_test.sh

  golden:
    name: golden search regression (Cas9 NGG + Cas12a TTTV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libgomp1

      # Byte-for-byte lock of the searchTST output for BOTH a Cas9 (NGG, 3' PAM)
      # and a Cas12a (TTTV, 5' PAM) guide over the committed synthetic genome,
      # with mismatches + a DNA bulge. The expected outputs live in
      # test/fixtures/golden/ and were generated with the #105-fixed binary.
      # Any drift in the search engine (mismatch/bulge/PAM handling, ordering,
      # or a #105-style regression) fails this job. This is the search-engine
      # analog of CRISPRme's two precomputed brute-force benchmarks.
      - name: Run golden search regression (Cas9 + Cas12a)
        run: bash test/run_golden_test.sh
        env:
          OMP_NUM_THREADS: "1"

  format1:
    name: index formats (2.9.1 indexes search as before but index 0; format-2 header and refusals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libgomp1

      # test/fixtures/format1 holds small indexes built by the 2.9.1 buildTST and the
      # 2.9.1 searchTST's output on them. Every row away from a contig's index-0 leaf
      # must stay byte-identical, order included; the index-0 rows must equal the
      # independent oracle (test/boundary/oracle.py): the reverse-strand PAM at a
      # contig's first base on the minus strand, and the builder's index-0 artefact gone.
      - name: Run format-1 compatibility test
        run: bash test/run_format1_test.sh

      # Format 2's header and trailer, crispritz.py index-info, a directory mixing the
      # two formats, max_bulges taken from the header, and the reader's refusals
      # (cut-short file, PAM side mismatch, unknown version; buildTST -bMax > 31);
      # index-info must refuse each of 18 damaged files searchTST refuses, for the
      # same reason, and docs/INDEX_FORMAT.md section 7's reader must agree with it.
      - name: Run index-format test
        run: bash test/run_index_format_test.sh

  boundary:
    name: sites at contig ends and N runs == independent brute-force oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libgomp1

      # Perfect, 1-4-mismatch and 1-bulge sites at every distance 0..4 from a contig
      # start, a contig end and an N run, both strands, 3' and 5' PAMs, the PAM 0..9
      # bases from an end; dedicated indexes at -bMax 0-3 and PAM-less K=3/K=8 (and
      # 5' K=4) indexes with and without --prune-pam; search guides longer and shorter
      # than the index's (CRISPRme's 21-nt SaCas9 and 23-nt Cas12a guides off 20-nt
      # indexes). Every indexed search, run through crispritz.py, must equal
      # test/boundary/oracle.py (a brute-force aligner over the FASTA) as a set of
      # rows, every row its contig's own bases, every 0-bulge one searchBruteForce too,
      # and every --prune-pam one the dedicated index of the same guide length.
      - name: Run boundary test (full matrix)
        run: bash test/run_boundary_test.sh

  asan:
    name: AddressSanitizer (#105 regression guard, WTN + DNA bulge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libgomp1 zlib1g-dev python3-pandas

      # searchOnTST.cpp had a heap-buffer-overflow (CRISPRme #105) that
      # AddressSanitizer aborts on when combined with a degenerate odd-length
      # PAM (WTN) and a DNA bulge. This job compiles with ASan and runs exactly
      # that repro: it MUST pass on the fixed code and would fail on the
      # unfixed code, locking in the fix.
      - name: Run ASan test (WTN + DNA bulge)
        run: bash test/run_minimal_test.sh
        env:
          PAM: WTN
          BDNA: "1"
          OMP_NUM_THREADS: "1"
          CXXFLAGS: "-fsanitize=address -g -O1"
          # No leak detection: we only guard against memory-safety errors
          # (heap-buffer-overflow / invalid free), and abort on any ASan error.
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"

      # The boundary suite under ASan: all three binaries (buildTST, searchTST,
      # searchBruteForce) instrumented, over index format 2's boundary sites (pad
      # and flank off the contig, signed window starts), the format-1 reader, the
      # damaged files of the index-format test and the four-allele symbol Q (its
      # slot-dependent tree nibbles; the enricher instrumented too).
      - name: Run ASan boundary, format-1, index-format and four-allele tests
        run: |
          QUICK=1 bash test/run_boundary_test.sh
          bash test/run_format1_test.sh
          bash test/run_index_format_test.sh
          bash test/run_four_allele_test.sh
        env:
          OMP_NUM_THREADS: "1"
          CXXFLAGS: "-fsanitize=address -g -O1"
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"

  arm64-build:
    name: native arm64 build + test (Apple Silicon / aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Compile and run the minimal NGG test natively for linux/arm64 inside a
      # gcc container under QEMU. This proves CRISPRitz builds and runs on
      # aarch64, which is what keeps the CRISPRme arm64 Docker image and Apple
      # Silicon (M1/M2/M3) usage safe. Kept tiny so it stays fast under QEMU.
      - name: Build + run minimal test on linux/arm64
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src -w /src \
            gcc:12 bash test/run_minimal_test.sh
        env:
          PAM: NGG
